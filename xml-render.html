<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#141418">
<title>Render XML Alight Motion</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#141418;color:#ececf1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:#1c1c22;border-bottom:1px solid #2a2a33}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
.pill{font-size:12px;color:#9a9aa8}
.upload{display:flex;align-items:center;gap:10px;margin:14px 16px 0;padding:12px 14px;background:#1c1c22;border:1px dashed #3a3a46;border-radius:12px}
.upload input{flex:1;min-width:0;color:#b9b9c6;font-size:13px}
.upload input::file-selector-button{font:inherit;font-weight:600;background:#2b2b36;color:#ececf1;border:0;border-radius:8px;padding:8px 12px;margin-right:10px;cursor:pointer}
.stage{margin:14px 16px 0;padding:12px;border-radius:14px;background:#0e0e12;border:1px solid #2a2a33;display:flex;justify-content:center}
#cv{display:block;max-width:100%;max-height:52vh;height:auto;border-radius:6px;background:repeating-conic-gradient(#202028 0 25%,#17171d 0 50%) 0/18px 18px}
.bar{display:flex;align-items:center;gap:8px;padding:12px 16px;margin-top:14px}
.bar select{font:inherit;font-size:13px;color:#ececf1;background:#1c1c22;border:1px solid #2a2a33;border-radius:10px;padding:9px 10px}
button{font:inherit;font-weight:700;font-size:14px;background:#7a4cf0;color:#fff;border:0;border-radius:10px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.ghost{background:#26262f;color:#ececf1}
.spacer{flex:1}
.layers{margin:0 16px 16px;background:#1c1c22;border:1px solid #2a2a33;border-radius:14px;overflow:hidden}
.layers-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #2a2a33;font-size:13px;color:#9a9aa8}
.layers-head b{color:#ececf1;font-size:14px}
.layer{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid #24242c;cursor:pointer;font-size:14px}
.layer:last-child{border-bottom:0}
.layer input{width:18px;height:18px;margin:0;accent-color:#7a4cf0}
.layer.off .n{color:#6d6d7a;text-decoration:line-through}
.swatch{width:26px;height:26px;border-radius:7px;border:1px solid #33333d;flex:none}
.layer .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .i{color:#6d6d7a;font-size:12px}
.muted{color:#8a8a98;font-size:13px;margin:0 16px 14px}
.empty{padding:28px 16px;text-align:center;color:#8a8a98;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Render XML</h1>
    <span class="pill">Alight Motion</span>
  </header>

  <div class="upload">
    <input id="file" type="file" accept=".xml,application/xml,text/xml">
  </div>

  <div class="stage">
    <canvas id="cv" width="1080" height="1080" aria-label="Pratinjau render"></canvas>
  </div>
  <p class="muted" id="st">Pilih file XML scene untuk mulai.</p>

  <div class="bar">
    <select id="skala" aria-label="Skala PNG">
      <option value="1">1x</option>
      <option value="2" selected>2x</option>
      <option value="3">3x</option>
    </select>
    <button class="ghost" id="go">Render</button>
    <span class="spacer"></span>
    <button id="dlpng" disabled>Unduh PNG</button>
  </div>

  <section class="layers" id="layersPanel" hidden>
    <div class="layers-head"><b>Layer</b><span id="layerCount"></span></div>
    <div id="layers"></div>
  </section>
</div>
<script>
const $ = id => document.getElementById(id);
let baseName = 'scene';
let scene = null; // hasil baca XML: { W, H, bg, layers: [...] }

// Warna #AARRGGBB jadi rgba() untuk canvas
function cssColor(argb) {
  const h = argb.replace('#', '').padStart(8, 'F');
  return `rgba(${parseInt(h.slice(2, 4), 16)},${parseInt(h.slice(4, 6), 16)},${parseInt(h.slice(6, 8), 16)},${parseInt(h.slice(0, 2), 16) / 255})`;
}

// Nilai atribut value; bila berupa keyframe, ambil nilai pertama
function valueOf(el) {
  if (!el) return null;
  return el.getAttribute('value') || (el.querySelector('kf') ? el.querySelector('kf').getAttribute('value') : null);
}

function parseXy(s, def) {
  if (!s) return def;
  const p = s.split(',').map(parseFloat);
  return [p[0] || 0, p[1] === undefined || Number.isNaN(p[1]) ? def[1] : p[1]];
}

// Bentuk primitif AM (rect, roundrect, ellipse) tanpa tag path: dibuat dari property size dan cornerRadius, berpusat di (0,0)
function primitiveD(shape) {
  const sz = shape.querySelector('property[name="size"]');
  if (!sz) return null;
  const [w, h] = parseXy(sz.getAttribute('value'), [0, 0]);
  if (!(w > 0 && h > 0)) return null;
  const x = -w / 2, y = -h / 2;
  if (/ellipse|circle/.test(shape.getAttribute('s') || '')) {
    const rx = w / 2, ry = h / 2;
    return `M${-rx} 0A${rx} ${ry} 0 1 0 ${rx} 0A${rx} ${ry} 0 1 0 ${-rx} 0Z`;
  }
  const r = Math.min(parseFloat(valueOf(shape.querySelector('property[name="cornerRadius"]'))) || 0, w / 2, h / 2);
  if (r <= 0) return `M${x} ${y}H${x + w}V${y + h}H${x}Z`;
  return `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
}

// Baca XML jadi daftar layer. Efek dan elemen lain diabaikan.
function parseScene(xmlStr) {
  const doc = new DOMParser().parseFromString(xmlStr, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('XML tidak valid.');
  const sc = doc.querySelector('scene');
  if (!sc) throw new Error('Tag scene tidak ditemukan.');
  const layers = [];
  doc.querySelectorAll('shape').forEach((shape, idx) => {
    const path = shape.querySelector('path');
    const d = path ? path.getAttribute('d') : primitiveD(shape);
    if (!d) return;
    const tf = shape.querySelector('transform');
    const [lx, ly] = parseXy(valueOf(tf && tf.querySelector('location')), [0, 0]);
    const [sx, sy] = parseXy(valueOf(tf && tf.querySelector('scale')), [1, 1]);
    const rot = (parseFloat(valueOf(tf && tf.querySelector('rotation'))) || 0) * Math.PI / 180;
    const op = parseFloat(valueOf(tf && tf.querySelector('opacity')) ?? valueOf(shape.querySelector('property[name="opacity"]')));
    layers.push({
      name: shape.getAttribute('label') || ('objek ' + (idx + 1)),
      color: valueOf(shape.querySelector('fillColor')) || '#FF000000',
      d, lx, ly, sx, sy, rot, op: Number.isFinite(op) ? Math.min(1, Math.max(0, op)) : 1,
      on: true
    });
  });
  return {
    W: parseFloat(sc.getAttribute('width')) || 1080,
    H: parseFloat(sc.getAttribute('height')) || 1080,
    bg: sc.getAttribute('bgcolor'),
    layers
  };
}

// Gambar layer yang dicentang ke kanvas
function drawScene(skala) {
  const cv = $('cv');
  cv.width = Math.round(scene.W * skala); cv.height = Math.round(scene.H * skala);
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, cv.width, cv.height);
  // Warna latar bila tidak transparan
  const bg = scene.bg;
  if (bg && bg.replace('#', '').length === 8 && !bg.endsWith('00') && !/^#00/.test(bg)) {
    ctx.fillStyle = cssColor(bg); ctx.fillRect(0, 0, cv.width, cv.height);
  }
  let count = 0;
  for (const L of scene.layers) {
    if (!L.on) continue;
    // Titik (x,y) pada path -> skala * (lokasi + skala_bentuk * titik), seperti pemutar AM
    // Rotasi searah jarum jam, lalu skala, lalu geser ke lokasi; opasitas ikut
    const cos = Math.cos(L.rot), sin = Math.sin(L.rot);
    ctx.setTransform(skala * cos * L.sx, skala * sin * L.sx, -skala * sin * L.sy, skala * cos * L.sy, skala * L.lx, skala * L.ly);
    ctx.globalAlpha = L.op;
    ctx.fillStyle = cssColor(L.color);
    ctx.fill(new Path2D(L.d), 'evenodd');
    count++;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  return count;
}

// Daftar layer dengan kotak centang
function buildLayerList() {
  const box = $('layers');
  box.innerHTML = '';
  scene.layers.forEach((L, i) => {
    const row = document.createElement('label');
    row.className = 'layer';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.checked = L.on;
    cb.addEventListener('change', () => { L.on = cb.checked; row.classList.toggle('off', !L.on); redraw(); });
    const sw = document.createElement('span');
    sw.className = 'swatch'; sw.style.background = cssColor(L.color);
    const n = document.createElement('span');
    n.className = 'n'; n.textContent = L.name;
    const idx = document.createElement('span');
    idx.className = 'i'; idx.textContent = '#' + (i + 1);
    row.append(cb, sw, n, idx);
    box.appendChild(row);
  });
  $('layerCount').textContent = `(${scene.layers.length} layer)`;
  $('layersPanel').hidden = false;
}

function redraw() {
  const count = drawScene(+$('skala').value);
  $('dlpng').disabled = count === 0;
  $('st').textContent = `Selesai: ${count} dari ${scene.layers.length} layer tampil, ${scene.W}×${scene.H} px (hasil ${$('cv').width}×${$('cv').height} px).`;
}

$('go').addEventListener('click', async () => {
  const f = $('file').files[0];
  if (!f) { $('st').textContent = 'Pilih file XML dulu.'; return; }
  $('go').disabled = true;
  $('dlpng').disabled = true;
  $('st').textContent = 'Membaca...';
  try {
    baseName = f.name.replace(/\.[^.]+$/, '') || 'scene';
    scene = parseScene(await f.text());
    if (!scene.layers.length) throw new Error('Tidak ada bentuk (shape) yang bisa dirender.');
    buildLayerList();
    redraw();
  } catch (e) {
    $('st').textContent = 'Gagal: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
});

$('skala').addEventListener('change', () => { if (scene) redraw(); });

$('dlpng').addEventListener('click', () => $('cv').toBlob(blob => {
  if (!blob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = baseName + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}, 'image/png'));
</script>
</body>
</html>
