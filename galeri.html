<!doctype html>
<html lang='id'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'>
<meta name='claude:viewport-fit-sides' content='cover'>
<title>Galeri Seni Publik · Test Work</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link rel='preconnect' href='https://fonts.gstatic.com' crossorigin>
<link href='https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='styles.css'>
</head>
<body>
<div class='wrap'>
  <header class='top'><a class='brand' href='index.html'>Test<span>Work</span></a></header>
  <h1>Galeri seni publik</h1>
  <p class='lead'>Karya berdomain publik dari koleksi Art Institute of Chicago. Klik Acak untuk melihat karya lain.</p>
  <div class='row' style='margin-bottom:14px'>
    <button id='rnd'>Acak</button>
    <span class='muted' id='st'></span>
  </div>
  <div class='grid' id='grid'></div>
  <p class='muted' style='margin-top:16px'>Sumber: API Art Institute of Chicago (api.artic.edu). Setiap karya ditampilkan dengan nama senimannya.</p>
</div>
<script>
const $ = id => document.getElementById(id);
const PAGES = 500; // halaman acak dari koleksi yang besar

async function load(page) {
  $('st').textContent = 'Memuat...';
  try {
    const r = await fetch(`https://api.artic.edu/api/v1/artworks?fields=id,title,artist_title,image_id,date_display,is_public_domain&limit=12&page=${page}`);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const { data } = await r.json();
    const items = data.filter(a => a.image_id && a.is_public_domain);
    const grid = $('grid');
    grid.innerHTML = '';
    for (const a of items) {
      const card = document.createElement('div');
      card.className = 'card';
      const img = document.createElement('img');
      img.src = `https://www.artic.edu/iiif/2/${a.image_id}/full/400,/0/default.jpg`;
      img.alt = a.title || 'Karya seni';
      img.loading = 'lazy';
      img.className = 'preview';
      const t = document.createElement('b');
      t.textContent = a.title || 'Tanpa judul';
      const s = document.createElement('small');
      s.textContent = [a.artist_title, a.date_display].filter(Boolean).join(' · ');
      card.append(img, t, s);
      grid.appendChild(card);
    }
    $('st').textContent = items.length ? '' : 'Tidak ada karya di halaman ini. Coba Acak lagi.';
  } catch (e) {
    $('st').textContent = 'Gagal memuat: ' + e.message;
  }
}

$('rnd').addEventListener('click', () => load(1 + Math.floor(Math.random() * PAGES)));
load(1);
</script>
</body>
</html>
