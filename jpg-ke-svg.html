<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JPG/PNG ke SVG</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;background:#F6F3EA;color:#0B0B0C;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;padding-block:24px;min-width:0}
h1{font-size:24px;margin:6px 0 4px}
.panel{background:#fff;border:3px solid #0B0B0C;box-shadow:4px 4px 0 #0B0B0C;border-radius:10px;padding:16px;margin-bottom:16px;min-width:0}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input[type=file]{width:100%;padding:9px;border:3px solid #0B0B0C;border-radius:10px;font:inherit;background:#fff;color:#0B0B0C}
input[type=range]{width:100%;accent-color:#2B4EFF}
button{font:inherit;font-weight:700;background:#2B4EFF;color:#fff;border:3px solid #0B0B0C;border-radius:10px;padding:10px 14px;box-shadow:3px 3px 0 #0B0B0C;cursor:pointer;margin:14px 8px 0 0}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0B0B0C}
button:disabled{opacity:.5;cursor:default}
button.ghost{background:#fff;color:#0B0B0C}
.muted{color:#46474C;font-size:13px}
#prev{display:block;max-width:100%;max-height:50vh;border:3px solid #0B0B0C;border-radius:10px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0/16px 16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>JPG/PNG ke SVG</h1>
  <p class="muted">Gambar diubah jadi vektor SVG langsung di perangkat Anda. Hasilnya bisa diunduh, lalu dibuka di menu SVG ke XML Alight Motion.</p>

  <div class="panel">
    <label for="file">File gambar (JPG, PNG, WEBP)</label>
    <input id="file" type="file" accept="image/*">

    <label for="warna">Jumlah warna: <b id="warnaV">32</b> (4–100)</label>
    <input id="warna" type="range" min="4" max="100" value="32">

    <label for="grid">Ketajaman grid: <b id="gridV">300</b> px (100–1000)</label>
    <input id="grid" type="range" min="100" max="1000" step="50" value="300">
    <p class="muted">Makin besar, makin detail tapi file SVG makin besar dan proses makin lama.</p>

    <div>
      <button id="go">Proses</button>
      <button class="ghost" id="dlsvg" disabled>Unduh SVG</button>
    </div>
    <p class="muted" id="st"></p>
  </div>

  <div class="panel">
    <label>Pratinjau</label>
    <img id="prev" alt="Pratinjau gambar" hidden>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let svgText = null, baseName = 'gambar', prevUrl = null;

// Android: file dari pemilih bisa 'basi' setelah dipilih, jadi isinya disalin ke memori saat dipilih
let cached = null;
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  cached = f ? f.arrayBuffer().then(buf => new Blob([buf], { type: f.type || 'image/png' })).catch(() => null) : null;
});
$('warna').oninput = e => $('warnaV').textContent = e.target.value;
$('grid').oninput = e => $('gridV').textContent = e.target.value;

// Ubah gambar jadi SVG: tiap baris dipecah jadi kotak warna yang berurutan (run-length)
function imageToSvg(blob, colors, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, w, h);
      const d = ctx.getImageData(0, 0, w, h).data;
      const step = Math.max(2, Math.round(256 / Math.cbrt(colors)));
      const groups = new Map();
      for (let y = 0; y < h; y++) {
        let run = null, start = 0;
        const flush = x => {
          if (run === null) return;
          if (!groups.has(run)) groups.set(run, []);
          groups.get(run).push(`M${start},${y}h${x - start}v1h-${x - start}z`);
        };
        for (let x = 0; x < w; x++) {
          const i = (y * w + x) * 4;
          let hex = null;
          if (d[i + 3] >= 128) {
            const r = Math.min(255, Math.round(d[i] / step) * step), g = Math.min(255, Math.round(d[i + 1] / step) * step), b = Math.min(255, Math.round(d[i + 2] / step) * step);
            hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
          }
          if (hex !== run) { flush(x); run = hex; start = x; }
        }
        flush(w);
      }
      let paths = '';
      for (const [color, parts] of groups) paths += `<path fill="${color}" d="${parts.join('')}"/>`;
      res(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="100%" height="100%">${paths}</svg>`);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Gambar tidak bisa dibaca. Coba format JPG atau PNG lain.')); };
    img.src = url;
  });
}

function save(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

$('go').addEventListener('click', async () => {
  const f = $('file').files[0];
  if (!f) { $('st').textContent = 'Pilih gambar dulu.'; return; }
  $('go').disabled = true;
  $('dlsvg').disabled = true;
  $('st').textContent = 'Memproses...';
  try {
    const blob = (cached && await cached) || f;
    baseName = f.name.replace(/\.[^.]+$/, '') || 'gambar';
    svgText = await imageToSvg(blob, +$('warna').value, +$('grid').value);
    if (prevUrl) URL.revokeObjectURL(prevUrl);
    prevUrl = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml' }));
    $('prev').src = prevUrl; $('prev').hidden = false;
    $('dlsvg').disabled = false;
    $('st').textContent = `Selesai. SVG ${(svgText.length / 1024).toFixed(0)} KB.`;
  } catch (e) {
    $('st').textContent = 'Gagal: ' + e.message;
  } finally {
    $('go').disabled = false;
  }
});

$('dlsvg').addEventListener('click', () => { if (svgText) save(baseName + '.svg', svgText, 'image/svg+xml'); });
</script>
</body>
</html>
