<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pembuat Password · Test Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top"><a class="brand" href="index.html">Test<span>Work</span></a></header>
  <h1>Pembuat password</h1>
  <p class="lead">Dibuat di perangkat Anda. Tidak ada yang dikirim ke server.</p>

  <div class="panel">
    <div class="out" id="pw" aria-live="polite"></div>
    <div class="row" style="margin-top:12px">
      <button id="gen">Buat lagi</button>
      <button class="ghost" id="copy">Salin</button>
    </div>
  </div>

  <div class="panel">
    <label for="len">Panjang: <span id="lenv">16</span> karakter</label>
    <input id="len" type="range" min="8" max="64" value="16">
    <div class="check"><input id="up" type="checkbox" checked> Huruf besar (A–Z)</div>
    <div class="check"><input id="lo" type="checkbox" checked> Huruf kecil (a–z)</div>
    <div class="check"><input id="nu" type="checkbox" checked> Angka (0–9)</div>
    <div class="check"><input id="sy" type="checkbox" checked> Simbol (!@#$…)</div>
    <p class="muted">Setidaknya satu jenis karakter harus dipilih.</p>
  </div>
</div>
<script>
const SETS = {
  up: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
  lo: 'abcdefghijklmnopqrstuvwxyz',
  nu: '0123456789',
  sy: '!@#$%^&*()-_=+[]{};:,.?'
};
const $ = id => document.getElementById(id);

function pick(chars) {
  // Acak dengan crypto, hindari bias modulo dengan membuang nilai di luar rentang
  const max = 256 - (256 % chars.length);
  const b = new Uint8Array(1);
  do { crypto.getRandomValues(b); } while (b[0] >= max);
  return chars[b[0] % chars.length];
}

function generate() {
  const enabled = ['up', 'lo', 'nu', 'sy'].filter(k => $(k).checked);
  if (!enabled.length) { $('pw').textContent = 'Pilih minimal satu jenis karakter.'; return; }
  const n = +$('len').value;
  const pool = enabled.map(k => SETS[k]).join('');
  // Pastikan setiap jenis terpilih muncul minimal sekali
  const chars = enabled.map(k => pick(SETS[k]));
  while (chars.length < n) chars.push(pick(pool));
  // Kocok (Fisher–Yates) agar posisi jenis karakter tidak bisa ditebak
  for (let i = chars.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  $('pw').textContent = chars.join('');
}

$('len').addEventListener('input', e => { $('lenv').textContent = e.target.value; generate(); });
['up', 'lo', 'nu', 'sy'].forEach(k => $(k).addEventListener('change', generate));
$('gen').addEventListener('click', generate);
$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText($('pw').textContent); $('copy').textContent = 'Tersalin'; }
  catch (e) { $('copy').textContent = 'Gagal, salin manual'; }
  setTimeout(() => $('copy').textContent = 'Salin', 1500);
});
generate();
</script>
</body>
</html>
